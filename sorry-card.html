<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para kay Tita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6d9d3; --bg2:#efbfc0; --card:#e0566b; --card-dark:#b83a52;
  --paper:#fffaf3; --ink:#4a2330; --soft:#8a5563;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#2a1620; --bg2:#3a1c29; --card:#d24a62; --card-dark:#9c3048; --paper:#fff4ea; --ink:#4a2330; --soft:#8a5563; }
}
:root[data-theme="dark"]{ --bg:#2a1620; --bg2:#3a1c29; --card:#d24a62; --card-dark:#9c3048; }
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 20%,var(--bg2),var(--bg));
  font-family:'Fraunces',Georgia,serif;color:var(--ink);overflow:hidden;
}
.hint{font-family:'Caveat',cursive,sans-serif;font-size:1.5rem;color:var(--soft);margin-top:2.2rem;transition:opacity .4s}
.open .hint{opacity:0}
.scene{perspective:1400px;width:min(86vw,340px);height:min(110vw,430px);max-height:70vh;cursor:pointer;position:relative}
.scene:focus-visible{outline:3px solid var(--ink);outline-offset:8px;border-radius:12px}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.inside,.cover{position:absolute;inset:0;border-radius:6px 14px 14px 6px}
.inside{
  background:var(--paper);box-shadow:0 18px 40px rgba(74,35,48,.25);
  display:flex;flex-direction:column;justify-content:center;padding:1.6rem 1.5rem 1.6rem 1.9rem;
  background-image:repeating-linear-gradient(transparent 0 33px,rgba(224,86,107,.13) 33px 34px);
}
.to{font-family:'Caveat',cursive;font-size:2.1rem;font-weight:700;margin:0 0 1rem;color:var(--card-dark)}
.msg{font-size:1.28rem;line-height:1.55;margin:0;font-style:italic;font-weight:400}
.from{font-family:'Caveat',cursive;font-size:1.9rem;font-weight:700;text-align:right;margin:1.6rem 0 0;color:var(--card-dark)}
.cover{
  background:linear-gradient(135deg,var(--card),var(--card-dark));
  transform-origin:left center;backface-visibility:hidden;transition:transform .9s cubic-bezier(.3,.7,.2,1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;
  box-shadow:0 18px 40px rgba(74,35,48,.3);color:#fff;text-align:center;
}
.cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:rgba(0,0,0,.14);border-radius:6px 0 0 6px}
.cover .big{font-size:4.4rem;line-height:1}
.cover h1{font-family:'Fraunces',serif;font-size:1.9rem;font-weight:600;margin:0}
.cover p{font-family:'Caveat',cursive;font-size:1.4rem;margin:0;opacity:.92}
.open .cover{transform:rotateY(-165deg)}
.open .card{transform:translateX(18%)}
@media (prefers-reduced-motion:reduce){.card,.cover{transition:none}}
.landing{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;background:radial-gradient(circle at 30% 20%,var(--bg2),var(--bg));transition:opacity .8s,visibility .8s;padding:1.5rem;text-align:center}
.landing.gone{opacity:0;visibility:hidden;pointer-events:none}
.landing h2{font-family:'Caveat',cursive,sans-serif;font-size:2rem;font-weight:500;margin:0;color:var(--soft)}
.clickme{font-family:'Fraunces',Georgia,serif;font-size:2rem;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--card),var(--card-dark));border:0;border-radius:999px;padding:1.1rem 2.8rem;cursor:pointer;box-shadow:0 14px 30px rgba(74,35,48,.3);animation:pulse 1.6s ease-in-out infinite}
.clickme:focus-visible{outline:3px solid var(--ink);outline-offset:6px}
@keyframes pulse{50%{transform:scale(1.07)}}
.mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:10;border:0;background:var(--paper);color:var(--ink);width:44px;height:44px;border-radius:50%;font-size:1.3rem;cursor:pointer;box-shadow:0 4px 12px rgba(74,35,48,.2)}
@media (prefers-reduced-motion:reduce){.clickme{animation:none}}
html,body{height:100dvh;-webkit-text-size-adjust:100%}
.scene,.clickme,.mute{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.cover,.inside{-webkit-backface-visibility:hidden}
@media (max-width:640px){
  .scene{width:min(82vw,330px);height:min(104vw,420px);max-height:66dvh}
  .open .card{transform:none}
  .open .cover{opacity:0;transition:transform .9s cubic-bezier(.3,.7,.2,1),opacity .3s .5s}
  .msg{font-size:1.2rem}
  .clickme{font-size:1.7rem;padding:1rem 2.4rem}
  .hint{font-size:1.35rem;margin-top:1.6rem}
}
@media (max-height:520px) and (orientation:landscape){
  .scene{height:78dvh;width:min(60vw,300px)}
  .hint{margin-top:.6rem}
}
</style>
</head>
<body>
<div class="landing" id="landing">
  <button class="clickme" id="go">Click me</button>
</div>

  s.addEventListener('click',toggle);
  s.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});

  var au=document.getElementById('song'),muted=false;
  function startMusic(){try{au.volume=.8;var p=au.play();if(p&&p.catch)p.catch(function(){});}catch(e){}}
  var mb=document.getElementById('mute');
  mb.addEventListener('click',function(){
    muted=!muted;
    au.muted=muted;
    mb.textContent=muted?'🔇':'🔊';
    mb.setAttribute('aria-label',muted?'I-play ang music':'I-mute ang music');
  });
  document.getElementById('go').addEventListener('click',function(){
    startMusic();
    document.getElementById('landing').classList.add('gone');
    mb.hidden=false;
  });
})();
</script>
</body>
</html>
